<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Vialback</title>
<meta name="theme-color" content="#0b1211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vialback">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<script>window.VIALBACK_PUBLIC=true;</script>
</head>
<body><title>Vialback — Peptide Protocol Tracker</title>
<style>
  :root{
    --bg:#f2f5f3;--panel:#fff;--panel2:#eef2f0;--ink:#0e1a18;--ink2:#4a5a56;--ink3:#7a8a86;
    --line:#dde5e2;--line2:#c8d4cf;--accent:#0f9e8f;--accent-soft:#d6efeb;--accent-ink:#0a6b60;
    --good:#2f9e6b;--good-soft:#dcefe4;--warn:#c67d16;--warn-soft:#f7ead2;--crit:#cf4b3c;--crit-soft:#f8ddd8;
    --gold:#b8842a;--shadow:0 1px 2px rgba(14,26,24,.06),0 6px 20px rgba(14,26,24,.05);
    --mono:ui-monospace,"Cascadia Code","SF Mono","JetBrains Mono",Consolas,Menlo,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#0b1211;--panel:#111b19;--panel2:#0e1615;--ink:#e6efec;--ink2:#a4b4af;--ink3:#6f807b;
    --line:#1e2c29;--line2:#2a3b37;--accent:#2dd4bf;--accent-soft:#123430;--accent-ink:#7ff0e2;
    --good:#43c489;--good-soft:#123027;--warn:#e0a13a;--warn-soft:#33280f;--crit:#e2685a;--crit-soft:#361b18;
    --gold:#e0b25a;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.35);}}
  :root[data-theme="light"]{--bg:#f2f5f3;--panel:#fff;--panel2:#eef2f0;--ink:#0e1a18;--ink2:#4a5a56;--ink3:#7a8a86;--line:#dde5e2;--line2:#c8d4cf;--accent:#0f9e8f;--accent-soft:#d6efeb;--accent-ink:#0a6b60;--good:#2f9e6b;--good-soft:#dcefe4;--warn:#c67d16;--warn-soft:#f7ead2;--crit:#cf4b3c;--crit-soft:#f8ddd8;--gold:#b8842a;--shadow:0 1px 2px rgba(14,26,24,.06),0 6px 20px rgba(14,26,24,.05);}
  :root[data-theme="dark"]{--bg:#0b1211;--panel:#111b19;--panel2:#0e1615;--ink:#e6efec;--ink2:#a4b4af;--ink3:#6f807b;--line:#1e2c29;--line2:#2a3b37;--accent:#2dd4bf;--accent-soft:#123430;--accent-ink:#7ff0e2;--good:#43c489;--good-soft:#123027;--warn:#e0a13a;--warn-soft:#33280f;--crit:#e2685a;--crit-soft:#361b18;--gold:#e0b25a;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.35);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  .tnum{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono)}
  .app{max-width:900px;margin:0 auto;min-height:100vh;padding:0 0 84px}
  @media(min-width:860px){.app{padding-left:88px;padding-bottom:0}}
  .top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 15px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:28px;height:28px;flex:0 0 auto}
  .brand h1{font-size:16px;margin:0;letter-spacing:-.02em;font-weight:700}
  .brand .sub{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:1px}
  .brand .spacer{flex:1}
  .iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink2);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px}
  .iconbtn:hover{border-color:var(--line2);color:var(--ink)}
  .avatar{background:var(--accent-soft);border:1px solid transparent;color:var(--accent-ink);font-weight:700;font-size:13px}
  main{padding:15px}
  .view{display:none;animation:fade .26s ease}.view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .vhead{display:flex;align-items:center;gap:10px;margin:2px 2px 13px}
  .vhead h2{font-size:15px;margin:0;letter-spacing:-.01em}.vhead .spacer{flex:1}
  .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
  /* banner */
  .banner{display:flex;align-items:center;gap:10px;background:var(--crit-soft);border:1px solid var(--crit);border-radius:12px;padding:11px 13px;margin-bottom:13px;font-size:13px;color:var(--ink)}
  .banner.warn{background:var(--warn-soft);border-color:var(--warn)}
  .banner b{color:var(--crit)}.banner.warn b{color:var(--warn)}
  /* cards */
  .cards{display:flex;flex-direction:column;gap:11px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;position:relative}
  .card .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line2)}
  .card.ok .stripe{background:var(--good)}.card.warn .stripe{background:var(--warn)}.card.crit .stripe{background:var(--crit)}
  .card.off{border-color:var(--crit);background:color-mix(in srgb,var(--crit-soft) 55%,var(--panel))}
  .card.off .stripe{background:var(--crit)}
  .chead{display:flex;align-items:center;gap:12px;padding:13px 14px 13px 17px}
  .cmain{flex:1;min-width:0}
  .cname{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cname .nm{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
  .chip{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--panel2);color:var(--ink3);border:1px solid var(--line)}
  .chip.off{background:var(--crit-soft);color:var(--crit);border-color:transparent}
  .cmeta{display:flex;align-items:center;gap:10px;margin-top:5px;flex-wrap:wrap}
  .dose{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--accent)}
  .timing{font-size:11.5px;color:var(--ink3)}
  /* vial gauge */
  .vial{display:flex;align-items:center;gap:12px;padding:0 14px 13px 17px}
  .ring{--p:0;width:52px;height:52px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gc) calc(var(--p)*1%),var(--panel2) 0);position:relative}
  .ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
  .ring .rt{position:relative;font-family:var(--mono);font-size:11px;font-weight:700}
  .vinfo{flex:1;min-width:0;font-size:12px;color:var(--ink2)}
  .vinfo .big{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:700}
  .vinfo .recon{color:var(--accent-ink);font-family:var(--mono);font-size:11px;margin-top:3px}
  .vacts{display:flex;gap:6px;align-items:center}
  .needle{border:0;border-radius:11px;background:var(--accent);color:#04201d;font-weight:700;font-size:13px;padding:10px 14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .needle:active{transform:scale(.94)}
  .rbtn{border:1px solid var(--line2);background:var(--panel);color:var(--ink2);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:16px}
  .rbtn:hover{color:var(--ink);border-color:var(--accent)}
  .cbody{border-top:1px dashed var(--line);padding:11px 14px 13px 17px;display:flex;gap:7px;flex-wrap:wrap}
  .mini{font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  .mini:hover{border-color:var(--accent);color:var(--accent)}
  .mini.danger:hover{border-color:var(--crit);color:var(--crit)}
  .infobtn{background:transparent;border:1px solid var(--line);color:var(--ink3);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;align-self:flex-start}
  .infobtn:hover{border-color:var(--accent);color:var(--accent)}
  .bx{background:transparent;border:0;color:var(--crit);font-size:20px;padding:0 2px;margin-left:auto;line-height:1;align-self:center}
  .tip2{position:fixed;z-index:90;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);font-size:11px;font-weight:600;padding:5px 9px;border-radius:7px;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
  .istat{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
  .istat:first-child{border-top:0}.istat .k{color:var(--ink2)}.istat .v{font-family:var(--mono);font-weight:700;text-align:right}
  .reccard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:13px;text-align:center}
  .recbig{font-size:14px;color:var(--ink2)}.recbig b{font-family:var(--mono);font-size:26px;color:var(--accent);font-weight:800}
  .syr{width:100%;max-width:250px;height:40px;margin:8px auto;display:block}
  .recmeta{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--ink3)}
  .recmeta b{color:var(--ink);font-family:var(--mono)}
  .recsug{font-size:11.5px;color:var(--accent-ink);margin-top:8px}
  .chip2{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:99px;padding:7px 13px}
  .chip2:hover{border-color:var(--accent)}
  /* FAB + button */
  .fab{position:fixed;right:18px;bottom:98px;z-index:25;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:#04201d;font-size:28px;font-weight:400;box-shadow:0 8px 24px rgba(15,158,143,.4);display:grid;place-items:center}
  @media(min-width:860px){.fab{bottom:24px}}
  .fab:active{transform:scale(.93)}
  .install{position:fixed;left:12px;right:12px;bottom:94px;z-index:28;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:var(--shadow)}
  .install.on{display:flex}
  .install .it{flex:1;font-size:12.5px;line-height:1.4}
  @media(min-width:860px){.install{left:auto;right:18px;max-width:330px;bottom:18px}}
  /* dropdown / modal */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(4,10,9,.5);display:none;align-items:flex-end;justify-content:center}
  .modal.on{display:flex;animation:fade .2s ease}
  @media(min-width:600px){.modal{align-items:center}}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;padding:16px 16px 22px;box-shadow:0 -8px 40px rgba(0,0,0,.3)}
  @media(min-width:600px){.sheet{border-radius:18px}}
  .sheet h3{margin:0 0 3px;font-size:15px}
  .msub{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:13px}
  .srch{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font-size:14px;margin-bottom:10px}
  .catlist{display:flex;flex-direction:column;gap:1px}
  .catrow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:9px;cursor:pointer}
  .catrow:hover{background:var(--panel2)}
  .catrow .cn{flex:1;font-size:13.5px;font-weight:550}
  .catrow .cc{font-family:var(--mono);font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
  .sizes{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .szbtn{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 11px}
  .szbtn:hover{border-color:var(--accent);color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
  .fld input,.fld select,.fld textarea{font-size:13.5px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--ink);width:100%}
  .fld input.mono{font-family:var(--mono)}
  .primary{margin-top:14px;width:100%;background:var(--accent);color:#04201d;border:0;border-radius:11px;padding:12px;font-weight:700;font-size:13.5px}
  .primary:active{transform:scale(.99)}
  .ghost{width:100%;margin-top:8px;text-align:center;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink2);font-size:12.5px}
  .ghost:hover{border-color:var(--line2);color:var(--ink)}
  .ghost.danger{color:var(--crit);border-color:var(--crit)}
  /* tip popover */
  .tip{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:70;max-width:300px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .tip button{margin-top:8px;background:var(--accent);color:#04201d;border:0;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700}
  /* guide */
  .guide{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px;margin-bottom:11px}
  .guide h3{margin:0 0 3px;font-size:15px}
  .guide .what{font-size:12.5px;color:var(--ink2);margin:2px 0 10px}
  .guide .gt{font-family:var(--mono);font-size:11px;color:var(--accent-ink);margin-bottom:11px}
  .nut{border-top:1px solid var(--line);padding:10px 0}
  .nut .nn{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px}
  .nut .nn .amt{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700;text-align:right}
  .nut .food{font-size:12px;color:var(--ink3);margin-top:3px}
  .nut .note{font-size:12px;color:var(--ink2);margin-top:3px}
  .warns{margin-top:11px;background:var(--warn-soft);border-radius:10px;padding:10px 12px;border-left:3px solid var(--warn)}
  .warns .wl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);margin-bottom:5px}
  .warns li{font-size:12px;color:var(--ink);margin:3px 0}
  .bwork{font-size:11.5px;color:var(--ink3);margin-top:10px;font-style:italic}
  /* calendar */
  .cal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dow{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink3);text-align:center;padding-bottom:6px;text-transform:uppercase}
  .day{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;cursor:pointer}
  .day.empty{background:transparent;border:0;cursor:default}
  .day .num{font-family:var(--mono);font-size:12px;color:var(--ink2)}
  .day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .day.today .num{color:var(--accent);font-weight:700}
  .day .cnt{font-family:var(--mono);font-size:9px;color:var(--good);font-weight:700}
  .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:32px}
  .dot{width:5px;height:5px;border-radius:99px;background:var(--good)}
  /* stats */
  .statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
  @media(min-width:520px){.statgrid{grid-template-columns:repeat(4,1fr)}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
  .stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
  .stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
  .stat .v small{font-size:12px;color:var(--ink3);font-weight:600}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px;margin-bottom:11px}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:13px}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink3);font-size:12.5px;font-weight:600;padding:8px;border-radius:8px}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  .row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .ri{flex:1;min-width:0}.row .rp{font-weight:600;font-size:13.5px}
  .row .rm{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:2px}
  .row .rv{text-align:right;font-family:var(--mono)}
  .pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:7px;font-weight:600}
  .pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.na{background:var(--panel2);color:var(--ink3)}
  .src{font-size:12px;color:var(--ink2);background:var(--panel2);border-radius:9px;padding:9px 11px;margin-top:9px;line-height:1.5}
  .src .rec{color:var(--accent-ink);font-weight:600}
  .del{background:transparent;border:0;color:var(--ink3);font-size:18px;padding:4px 6px;border-radius:7px}
  .del:hover{color:var(--crit);background:var(--crit-soft)}
  .empty-note{text-align:center;color:var(--ink3);font-size:13px;padding:26px 10px;font-family:var(--mono);letter-spacing:.03em}
  .settbl{display:flex;flex-direction:column}
  .setrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
  .setrow:first-child{border-top:0}
  .cbx{width:22px;height:22px;flex:0 0 auto;border-radius:6px;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;font-size:14px;font-weight:800}
  .cbx.on{background:var(--accent);border-color:var(--accent);color:#04201d}
  .toggle{width:46px;height:27px;border-radius:99px;background:var(--line2);position:relative;flex:0 0 auto;transition:background .2s}
  .toggle.on{background:var(--accent)}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .2s}
  .toggle.on::after{left:22px}
  /* nav */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:5px 4px calc(5px + env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:1 0 auto;min-width:58px;background:transparent;border:0;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:10px;font-family:var(--mono);font-size:9px;letter-spacing:.03em;text-transform:uppercase}
  .nav button svg{width:20px;height:20px}
  .nav button.on{color:var(--accent)}
  .nav .ni{width:40px;height:26px;border-radius:9px;display:grid;place-items:center;transition:background .2s}
  .nav button.on .ni{background:var(--accent-soft)}
  @media(min-width:860px){.nav{top:0;bottom:0;right:auto;width:88px;flex-direction:column;justify-content:flex-start;padding:14px 8px;border-top:0;border-right:1px solid var(--line);gap:4px;overflow:visible}.nav button{flex:0 0 auto;min-width:0}}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);z-index:80;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--shadow)}

/* ---------- schedule math ---------- */
function dueOn(p,d){const s=p.sched;if(p.status!=="active")return false;
  if(s.t==="daily")return true;if(s.t==="week")return s.days.includes(new Date(d).getDay());return false;}
function doseMg(p){return p.unit==="mcg"?p.dose/1000:p.dose;}
function weeklyMg(p){const s=p.sched,d=doseMg(p);if(s.t==="daily")return d*7;if(s.t==="week")return d*s.days.length;return d;}
function daysLeft(p){const w=weeklyMg(p);if(!w)return null;return Math.floor(p.remaining/(w/7));}
function doseLabel(p){return p.label||`${p.dose} ${p.unit}`;}
function reconUnits(p){if(!p.bacMl||!p.vialMg)return null;const conc=p.vialMg/p.bacMl;return round(doseMg(p)/conc*100,1);}
/* pick a bac-water volume that lands the dose on a clean, even unit mark */
function suggestBac(vialMg,doseMg){const opts=[0.5,1,1.5,2,2.5,3,4,5];let best=null;
  opts.forEach(b=>{const u=doseMg*b/vialMg*100,r=Math.round(u);let sc=0;
    if(Math.abs(u-r)<0.06)sc+=2;if(r%10===0)sc+=3;else if(r%5===0)sc+=2;
    if(u>=15&&u<=90)sc+=2;else if(u<8||u>100)sc-=4;
    if(!best||sc>best.sc||(sc===best.sc&&Math.abs(u-50)<Math.abs(best.u-50)))best={b,u,sc};});
  return best||{b:2,u:doseMg*2/vialMg*100};}

  return `<svg class="syr" viewBox="0 0 220 40" fill="none"><rect x="${x0-9}" y="9" width="9" height="20" rx="2" fill="var(--line2)"/>
    <rect x="${x0}" y="12" width="${w}" height="14" rx="3" fill="var(--panel)" stroke="var(--line2)"/>
    <rect x="${x0}" y="12" width="${w*u/100}" height="14" rx="3" fill="var(--accent)" opacity="0.85"/>${t}
    <line x1="${x0+w}" y1="19" x2="216" y2="19" stroke="var(--ink3)" stroke-width="2"/>
    <line x1="${x0+w*u/100}" y1="7" x2="${x0+w*u/100}" y2="31" stroke="var(--accent-ink)" stroke-width="2"/></svg>`;}

function renderTrack(){

  // yellow (about to run out) on top, then green, then red (empty or deactivated) at the bottom
  const yellow=[],green=[],red=[];
  active.forEach(p=>{const d=daysLeft(p);if(p.remaining<=0)red.push(p);else if(d!=null&&d<=14)yellow.push(p);else green.push(p);});
  const byDays=(a,b)=>(daysLeft(a)??999)-(daysLeft(b)??999);
  yellow.sort(byDays);green.sort(byDays);off.forEach(p=>red.push(p));
  html+=`<div class="cards">`;
  [...yellow,...green,...red].forEach(p=>html+=trackCard(p));
  html+=`</div>`;
  if(!S.track.length) html=`<div class="empty-note">Tap + to add your first peptide.</div>`;
  el.innerHTML=html;

  const bx=$("[data-banx]",el);if(bx)bx.onclick=()=>{S.settings.bannerDismiss=iso(new Date());save();renderTrack();};

function infoPop(id){

  for(let i=0;i<30;i++){const d=new Date(Date.now()-i*DAY),k=iso(d);if(dueOn(p,d))s30++;if(S.log[k]&&S.log[k][id])d30++;}
  const adher=s30?Math.round(Math.min(100,d30/s30*100)):null;

  const st=(k,v)=>`<div class="istat"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  $("#sheet").innerHTML=`<h3>${p.name}</h3><div class="msub">${p.cat} · your stats</div>
    ${st("Dose",doseLabel(p))}
    ${st("Schedule",p.sched.t==="daily"?"Every day":p.sched.days.map(d=>WD[d]).join(", "))}

function trackCard(p){

function inject(id){const p=pById(id);if(!p)return;

function addFinal(name,size,vialUnit,dose,du,bac){

/* ============ PROGRESS ============ */
function renderProgress(){
  const el=$("#v-progress");const td=new Date();

    exp7+=due;done7+=Object.keys(S.log[k]||{}).length;}
  const adher=exp7?Math.round(Math.min(100,done7/exp7*100)):0;
  let streak=0;for(let i=0;i<400;i++){const k=iso(new Date(+td-i*DAY));if(Object.keys(S.log[k]||{}).length){streak++;}else if(i>0)break;}
  const moKey=iso(td).slice(0,7);let moDoses=0;Object.keys(S.log).forEach(k=>{if(k.slice(0,7)===moKey)moDoses+=Object.keys(S.log[k]).length;});

    <div class="statgrid">
      <div class="stat"><div class="k">Adherence 7d</div><div class="v">${adher}<small>%</small></div></div>
      <div class="stat"><div class="k">Log streak</div><div class="v">${streak}<small> d</small></div></div>
      <div class="stat"><div class="k">Doses this mo</div><div class="v">${moDoses}</div></div>
      <div class="stat"><div class="k">Latest weight</div><div class="v">${lastW?lastW.weight:"–"}<small>${lastW?" lb":""}</small></div></div>
    </div>
    <div class="panel"><div class="lbl" style="margin-bottom:10px">Log weight / note (for your bloodwork check-in)</div>
      <div class="grid2"><div class="fld"><label>Weight (lb)</label><input class="mono" id="wV" type="number" inputmode="decimal"></div>

      <button class="primary" id="wAdd">+ Add entry</button></div>

      ${ws.length?[...ws].reverse().map(w=>`<div class="row"><div class="ri"><div class="rp">${w.weight?w.weight+" lb":"note"}</div><div class="rm">${w.date}${w.note?" · "+w.note:""}</div></div><button class="del" data-wdel="${w.id}">×</button></div>`).join(""):`<div class="empty-note">No entries yet.</div>`}</div>`;

}

  let html=`<div class="vhead"><h2>Buy</h2><div class="spacer"></div><span class="chip">${PUBLIC?"restock":"your restock"}</span></div>
    <div class="src" style="margin-top:0;margin-bottom:12px">${PUBLIC?"What's running low. Refill or reorder before you run out.":"Admin view: your personal supply. When something's low, here's the cheaper vendor to reorder from. You've ordered from <b>Lucky</b>, not <b>Peptide Source</b> yet."}</div>`;
  list.forEach(p=>{const d=daysLeft(p),src=SRC[p.guideKey||p.id];
    const cls=d==null?"na":d<=7?"crit":d<=21?"warn":"good";
    const pill=d==null?`<span class="pill na">no rate</span>`:`<span class="pill ${cls}">${d}d left</span>`;
    let rec="";if(src&&!PUBLIC){const cheaper=src.p[1]<=src.l[1]?"Peptide Source":"Lucky";
      rec=`<div class="src"><b>Reorder:</b> Lucky ${src.l[0]} ${money(src.l[1])} · Peptide Source ${src.p[0]} ${money(src.p[1])}<br><span class="rec">→ ${cheaper} is cheaper${cheaper==="Peptide Source"?" (still untested for you)":""}</span></div>`;}
    html+=`<div class="panel"><div class="row" style="border:0;padding:0"><div class="ri"><div class="rp">${p.name}</div><div class="rm">${round(p.remaining,1)}/${p.vialMg}${p.unit} · ${doseLabel(p)}</div></div>${pill}</div>${rec}</div>`;});
  el.innerHTML=html;
}

/* ============ SALES (separate resale inventory + log) ============ */
let salesTab="stock";
function renderSales(){
  const el=$("#v-sales");
  const mo=iso(new Date()).slice(0,7);let rev=0,cost=0;
  S.sales.forEach(s=>{if((s.date||"").slice(0,7)===mo){rev+=s.qty*s.price;cost+=s.qty*s.cost;}});
  let body="";
  if(salesTab==="stock"){
    body=`<div class="panel"><div class="lbl" style="margin-bottom:10px">Add stock for resale</div>
      <div class="grid2"><div class="fld" style="grid-column:1/3"><label>Product</label><input id="rName" list="rNames" placeholder="e.g. Retatrutide 30mg"><datalist id="rNames">${Object.keys(LUCKY).map(n=>`<option>${n}</option>`).join("")}</datalist></div>
        <div class="fld"><label>Vials on hand</label><input class="mono" id="rQty" type="number" inputmode="decimal" value="10"></div>
        <div class="fld"><label>Your cost / vial</label><input class="mono" id="rCost" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="fld"><label>Ask price / vial</label><input class="mono" id="rAsk" type="number" inputmode="decimal" placeholder="0"></div></div>
      <button class="primary" id="rAdd">+ Add to stock</button></div>
      <div class="panel"><div class="lbl" style="margin-bottom:8px">In stock</div>
      ${S.resale.length?S.resale.map(r=>`<div class="row"><div class="ri"><div class="rp">${r.name} <span class="mono" style="color:var(--ink3);font-weight:600">×${r.qty}</span></div><div class="rm">cost ${money(r.cost)} · ask ${money(r.ask)} · margin ${money(r.ask-r.cost)}/vial</div></div><button class="del" data-rdel="${r.id}">×</button></div>`).join(""):`<div class="empty-note">No resale stock yet.</div>`}</div>`;
  }else{
    body=`<div class="statgrid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><div class="k">Revenue mo</div><div class="v">${money(rev)}</div></div>
      <div class="stat"><div class="k">Cost mo</div><div class="v">${money(cost)}</div></div>
      <div class="stat"><div class="k">Profit mo</div><div class="v" style="color:var(--good)">${money(rev-cost)}</div></div></div>
      <div class="panel"><div class="lbl" style="margin-bottom:10px">Record a sale</div>
      <div class="grid2"><div class="fld" style="grid-column:1/3"><label>Product</label><select id="sProd">${S.resale.length?S.resale.map(r=>`<option value="${r.id}">${r.name} (${r.qty} left)</option>`).join(""):`<option value="">add stock first</option>`}</select></div>
        <div class="fld"><label>Vials sold</label><input class="mono" id="sQty" type="number" value="1"></div>
        <div class="fld"><label>Price / vial</label><input class="mono" id="sPrice" type="number" inputmode="decimal"></div>
        <div class="fld"><label>Buyer</label><input id="sBuyer" type="text"></div>
        <div class="fld"><label>Where / channel</label><input id="sChan" type="text"></div></div>
      <button class="primary" id="sAdd">+ Record sale</button></div>
      <div class="panel"><div class="lbl" style="margin-bottom:8px">Sales log</div>
      ${S.sales.length?[...S.sales].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(s=>`<div class="row"><div class="ri"><div class="rp">${s.name} <span class="mono" style="color:var(--ink3);font-weight:600">×${s.qty}</span></div><div class="rm">${s.date}${s.buyer?" · "+s.buyer:""}${s.chan?" · "+s.chan:""}</div></div><div class="rv"><div style="font-weight:700">${money(s.qty*s.price)}</div><div style="font-size:10.5px;color:var(--good)">+${money(s.qty*(s.price-s.cost))}</div></div><button class="del" data-sdel="${s.id}">×</button></div>`).join(""):`<div class="empty-note">No sales logged yet.</div>`}</div>`;
  }
  el.innerHTML=`<div class="vhead"><h2>Sales</h2></div>
    <div class="seg"><button data-st="stock" class="${salesTab==='stock'?'on':''}">Resale stock</button><button data-st="log" class="${salesTab==='log'?'on':''}">Sales log</button></div>${body}`;
  $$("[data-st]",el).forEach(b=>b.onclick=()=>{salesTab=b.dataset.st;renderSales();});
  if(salesTab==="stock"){
    $("#rAdd").onclick=()=>{const nm=$("#rName").value.trim();if(!nm){toast("Name the product");return;}
      S.resale.push({id:Date.now()+"",name:nm,qty:parseFloat($("#rQty").value)||0,cost:parseFloat($("#rCost").value)||0,ask:parseFloat($("#rAsk").value)||0});save();renderSales();toast("Added to stock");};
    $$("[data-rdel]",el).forEach(b=>b.onclick=()=>{S.resale=S.resale.filter(r=>r.id!==b.dataset.rdel);save();renderSales();});
  }else{
    $("#sAdd").onclick=()=>{const rid=$("#sProd").value,r=S.resale.find(x=>x.id===rid);if(!r){toast("Add resale stock first");return;}
      const qty=parseFloat($("#sQty").value)||0,price=parseFloat($("#sPrice").value)||0;if(!qty||!price){toast("Enter vials and price");return;}
      S.sales.push({id:Date.now()+"",name:r.name,qty,price,cost:r.cost,date:iso(new Date()),buyer:$("#sBuyer").value.trim(),chan:$("#sChan").value.trim()});
      r.qty=Math.max(0,r.qty-qty);save();renderSales();toast("Sale recorded");};
    $$("[data-sdel]",el).forEach(b=>b.onclick=()=>{S.sales=S.sales.filter(s=>s.id!==b.dataset.sdel);save();renderSales();});
  }
}

/* ============ SETTINGS ============ */
function renderSettings(){
  const el=$("#v-settings");
  const rows=S.track.map(p=>`<div class="setrow"><div class="cbx ${p.status!=='removed'?'on':''}" data-keep="${p.id}">${p.status!=='removed'?'✓':''}</div>
      <div style="flex:1"><div style="font-weight:600;font-size:13.5px">${p.name} ${p.status==='off'?'<span class="chip off">off</span>':''}</div><div class="rm mono">${doseLabel(p)} · ${p.cat}</div></div>
      <button class="del" data-remove="${p.id}">×</button></div>`).join("");
  const days=Object.keys(S.log).sort((a,b)=>b.localeCompare(a));
  const hist=days.length?days.map(k=>{const items=Object.keys(S.log[k]).map(id=>{const p=pById(id),e=S.log[k][id];return (p?p.name:id)+" "+e.dose+(e.unit||"");});
    return `<div class="row" data-hist="${k}"><div class="ri"><div class="rp">${WD[parseISO(k).getDay()]} · ${k}</div><div class="rm">${items.join(" · ")}</div></div><span class="chip">${items.length}</span></div>`;}).join(""):`<div class="empty-note">Nothing logged yet.</div>`;
  const ws=[...S.weights].sort((a,b)=>b.date.localeCompare(a.date));
  const arch=S.archive.length?S.archive.map(a=>`<div class="row"><div class="ri"><div class="rp">${a.name}</div><div class="rm">${doseLabel(a)} · ${a.vialMg}mg vial · ${a.bacMl||2}mL</div></div><button class="mini" data-restore="${a.name}">Restore</button><button class="del" data-adel="${a.name}">×</button></div>`).join(""):`<div class="empty-note">Nothing archived. Archive a peptide from its Edit screen to park it here with its settings.</div>`;
  el.innerHTML=`<div class="vhead"><h2>Settings</h2></div>
    <div class="panel"><div class="lbl" style="margin-bottom:10px">Profile · weigh-ins</div>
      <div class="grid2"><div class="fld"><label>Weight (lb)</label><input class="mono" id="wV" type="number" inputmode="decimal"></div><div class="fld"><label>Date</label><input class="mono" id="wD" type="date" value="${iso(new Date())}"></div></div>
      <div class="fld" style="margin-top:9px"><label>Note</label><input id="wN" type="text" placeholder="energy, sleep, sides..."></div>
      <button class="primary" id="wAdd">+ Add weigh-in</button>
      <div style="margin-top:6px">${ws.length?ws.map(w=>`<div class="row"><div class="ri"><div class="rp">${w.weight?w.weight+" lb":"note"}</div><div class="rm">${w.date}${w.note?" · "+w.note:""}</div></div><button class="del" data-wdel="${w.id}">×</button></div>`).join(""):`<div class="empty-note">No weigh-ins yet.</div>`}</div></div>
    <div class="panel"><div class="lbl" style="margin-bottom:8px">Archive</div><div class="lbl" style="text-transform:none;letter-spacing:0;color:var(--ink3);font-family:var(--sans);margin-bottom:8px">Parked peptides keep their settings. Adding one again from + preloads them.</div>${arch}</div>
    <div class="panel"><div class="lbl" style="margin-bottom:6px">Tracking history</div><div class="lbl" style="text-transform:none;letter-spacing:0;color:var(--ink3);font-family:var(--sans);margin-bottom:8px">Everything you've logged. Tap a day to edit it, even in the past.</div>${hist}</div>
    <div class="panel"><div class="setrow" style="border:0"><div style="flex:1"><div style="font-weight:600;font-size:13.5px">Restock notifications</div><div class="rm">Warn me when under a week of doses is left</div></div><div class="toggle ${S.settings.notify?'on':''}" id="notifTog"></div></div></div>
    <div class="panel"><div class="lbl" style="margin-bottom:6px">My peptides</div><div class="lbl" style="text-transform:none;letter-spacing:0;color:var(--ink3);font-family:var(--sans);margin-bottom:8px">Uncheck to hide, × to remove. Deactivate from a card to redden it and drop it to the bottom; archive from Edit to park it with its settings.</div>
      <div class="settbl">${rows}</div></div>
    <div class="panel"><div class="lbl" style="margin-bottom:10px">Data</div>
      <button class="primary" id="setExport">↓ Export backup (.json)</button>
      <button class="ghost" id="setImport">↑ Import backup</button>
      <button class="ghost danger" id="setReset">Reset everything to defaults</button>
      <div class="lbl" style="text-transform:none;letter-spacing:0;color:var(--ink3);font-family:var(--sans);margin-top:10px">Saved on this device. Export to back up or move to another phone. Cloud sync is planned.</div></div>`;
  $("#wAdd").onclick=()=>{const v=parseFloat($("#wV").value),n=$("#wN").value.trim();if(!v&&!n){toast("Enter a weight or note");return;}S.weights.push({id:Date.now()+"",weight:v||"",note:n,date:$("#wD").value||iso(new Date())});save();renderSettings();toast("Logged");};
  $$("[data-wdel]",el).forEach(b=>b.onclick=()=>{S.weights=S.weights.filter(w=>w.id!==b.dataset.wdel);save();renderSettings();});
  $$("[data-restore]",el).forEach(b=>b.onclick=()=>restoreArch(b.dataset.restore));
  $$("[data-adel]",el).forEach(b=>b.onclick=()=>{S.archive=S.archive.filter(a=>a.name!==b.dataset.adel);save();renderSettings();});
  $("#notifTog").onclick=()=>{S.settings.notify=!S.settings.notify;save();renderSettings();};
  $$("[data-keep]",el).forEach(b=>b.onclick=()=>{const p=pById(b.dataset.keep);p.status=p.status==='removed'?'active':'removed';save();renderSettings();});
  $$("[data-remove]",el).forEach(b=>b.onclick=()=>{S.track=S.track.filter(x=>x.id!==b.dataset.remove);save();renderSettings();toast("Removed");});
  $$("[data-hist]",el).forEach(b=>b.onclick=()=>editDay(b.dataset.hist));
  $("#setExport").onclick=exportData;$("#setImport").onclick=()=>$("#importFile").click();
  $("#setReset").onclick=()=>{if(confirm("Reset all data to defaults? Logs and sales will be cleared.")){localStorage.removeItem(KEY);S=load();applyTheme();renderAll();setTab("track");toast("Reset");}};
}

/* ============ export / import ============ */
async function exportData(){const data=JSON.stringify(S,null,2);
  if(window.claude&&window.claude.downloads){try{await window.claude.downloads.save({filename:`vialback-backup-${iso(new Date())}.json`,data});toast("Backup saved");}
    catch(err){if(err&&err.code==="declined")toast("Cancelled");else if(err&&err.code==="rate_limited")toast("Try again shortly");else fbExport(data);}}
  else fbExport(data);}
function fbExport(data){const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=`vialback-backup-${iso(new Date())}.json`;a.click();URL.revokeObjectURL(url);toast("Backup downloaded");}
$("#importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.track)S.track=d.track;if(d.archive)S.archive=d.archive;if(d.log)S.log=d.log;if(d.sales)S.sales=d.sales;if(d.resale)S.resale=d.resale;if(d.weights)S.weights=d.weights;if(d.settings)S.settings=d.settings;save();applyTheme();renderAll();setTab("track");toast("Imported");}catch(err){toast("Couldn't read that file");}};
  r.readAsText(f);e.target.value="";};

/* ============ nav / shell ============ */
const SUBS={track:"Track",guide:"Guide",cal:"Log",buy:"Buy",sales:"Sales",settings:"Settings"};
let tab="track";
function setTab(t){tab=t;$$(".view").forEach(v=>v.classList.remove("on"));$("#v-"+t).classList.add("on");
  $$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  $("#topSub").textContent=SUBS[t]||"";$("#fab").style.display=t==="track"?"grid":"none";
  ({track:renderTrack,guide:renderGuide,cal:renderCal,buy:renderBuy,sales:renderSales,settings:renderSettings}[t]||(()=>{}))();
  window.scrollTo({top:0,behavior:"smooth"});}
$$("#nav button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("#profileBtn").onclick=()=>setTab("settings");
function closeModal(){$("#modal").classList.remove("on");}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal();};
function renderAll(){renderTrack();}
let tT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("on"),1900);}

/* tooltips: hover on desktop, press-and-hold on touch */
let tipEl;
function showTipFor(el){hideTip();const r=el.getBoundingClientRect();tipEl=document.createElement("div");tipEl.className="tip2";tipEl.textContent=el.dataset.tip;document.body.appendChild(tipEl);tipEl.style.left=(r.left+r.width/2)+"px";tipEl.style.top=(r.top-6)+"px";}
function hideTip(){if(tipEl){tipEl.remove();tipEl=null;}}
function initTips(){
  document.addEventListener("mouseover",e=>{const t=e.target.closest("[data-tip]");if(t)showTipFor(t);});
  document.addEventListener("mouseout",e=>{if(e.target.closest("[data-tip]"))hideTip();});
  document.addEventListener("touchstart",e=>{const t=e.target.closest("[data-tip]");if(t){t._held=false;t._timer=setTimeout(()=>{t._held=true;showTipFor(t);},350);}},{passive:true});
  document.addEventListener("touchend",e=>{const t=e.target.closest("[data-tip]");if(t){clearTimeout(t._timer);if(t._held){e.preventDefault();setTimeout(hideTip,1000);}}},{passive:false});
}

/* add-to-home-screen hint for iOS Safari (Android's own install is already simple) */
function standalone(){return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;}
function showInstall(){
  const bar=$("#installBar");if(!bar||standalone()||localStorage.getItem("vb_install_x"))return;
  if(!/iphone|ipad|ipod/i.test(navigator.userAgent))return;
  bar.innerHTML=`<div class="it">To install: tap <b>Share</b> ⬆ at the bottom of Safari, then <b>Add to Home Screen</b>.</div><button class="bx" id="instX" aria-label="Dismiss">×</button>`;
  bar.classList.add("on");
  $("#instX").onclick=()=>{bar.classList.remove("on");localStorage.setItem("vb_install_x","1");};
}

/* public build (hosted for others) hides the Sales / resale business tab */
const PUBLIC=!!window.VIALBACK_PUBLIC;
if(PUBLIC){const sb=document.querySelector('#nav button[data-tab="sales"]');if(sb)sb.remove();const sv=document.getElementById('v-sales');if(sv)sv.remove();}

/* init */
initTips();renderTrack();syncNative();
if(PUBLIC)setTimeout(showInstall,1400);
</script>
